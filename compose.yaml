services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKUP_ROOT: /app/backups
    ports:
      - "${APP_PORT:-8088}:8000"
    volumes:
      - media_data:/app/media
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup_scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKUP_ROOT: /app/backups
    command: ["python", "manage.py", "run_backup_scheduler"]
    volumes:
      - media_data:/app/media:ro
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups
    depends_on:
      web:
        condition: service_healthy

volumes:
  database_data:
  media_data:
